name: Android CI

# Build the app on every push to master and on every pull request that targets it, so a change
# that fails to compile is caught before it is merged.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A newer push to the same branch/PR cancels an in-flight run, so CI doesn't queue up stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs the Android command-line tools and accepts the SDK licenses so the build can
      # provision whatever build-tools it needs. Override the default packages input: it otherwise
      # installs the obsolete "tools" package, which no longer exists and fails the step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # Try to install the compile SDK platform. A just-released API level may not yet be published
      # to the SDK repository the runner can reach; if so this is a no-op and the build falls back to
      # the platform the runner image already ships. Best-effort on purpose - the build step below is
      # the real check, so a missing-package warning here must not fail the job.
      - name: Install the compile SDK platform
        continue-on-error: true
        run: sdkmanager "platforms;android-37"

      # Configures Gradle and caches the dependency/build caches between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Lint fails only on errors; warnings are reported but don't block the build.
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
